<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Krypto — next generation crypto trading platform." />
    <title>Krypto — Next Generation Crypto Trading</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <a href="/" class="logo" aria-label="Krypto — главная">Krypto</a>

        <nav class="nav" aria-label="Основная навигация">
          <ul class="nav__list">
            <li><a class="nav__link" href="#how-it-works">How it works</a></li>
            <li><a class="nav__link" href="#cryptos">Cryptos</a></li>
            <li><a class="nav__link" href="#features">Features</a></li>
            <li><a class="nav__link" href="#testimonial">Testimonial</a></li>
            <li><a class="nav__link" href="#university">University</a></li>
          </ul>
        </nav>

        <button class="lang" type="button">
          <span class="lang__flag" aria-hidden="true">🇺🇸</span>
          <span class="lang__code">EN</span>
          <svg class="lang__arrow" width="10" height="6" aria-hidden="true">
            <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="hero" id="how-it-works">
        <div class="hero__decor" aria-hidden="true">
          <img
            class="hero__coin hero__coin--btc"
            src="img/coin-btc.png"
            alt=""
            width="220"
            height="220"
          />
          <img
            class="hero__coin hero__coin--ltc"
            src="img/coin-btc.png"
            alt=""
            width="160"
            height="160"
          />
          <img
            class="hero__coin hero__coin--eth"
            src="img/coin-btc.png"
            alt=""
            width="200"
            height="200"
          />
        </div>

        <div class="container hero__inner">
          <h1 class="hero__title">Next Generation<br />Crypto Trading</h1>

          <div class="timer" data-timer="2027-01-01T00:00:00">
            <p class="timer__label">Crypto Market Starts in</p>

            <div class="timer__clock" role="timer" aria-live="off">
              <div class="timer__unit">
                <span class="timer__value" data-days>02</span>
                <span class="timer__sep" aria-hidden="true">:</span>
                <span class="timer__caption">Days</span>
              </div>
              <div class="timer__unit">
                <span class="timer__value" data-hours>12</span>
                <span class="timer__sep" aria-hidden="true">:</span>
                <span class="timer__caption">Hours</span>
              </div>
              <div class="timer__unit">
                <span class="timer__value" data-minutes>23</span>
                <span class="timer__sep" aria-hidden="true">:</span>
                <span class="timer__caption">Minutes</span>
              </div>
              <div class="timer__unit">
                <span class="timer__value" data-seconds>35</span>
                <span class="timer__sep" aria-hidden="true">:</span>
                <span class="timer__caption">Seconds</span>
              </div>
            </div>
          </div>

          <div class="hero__actions">
            <a class="btn btn--solid" href="#">Download app</a>
            <a class="btn btn--ghost" href="#cryptos">Trade crypto</a>
          </div>

          <div class="hero__accept">
            <p class="hero__accept-label">We accept</p>
            <ul class="chips">
              <li class="chip">
                <img class="chip__icon" src="img/coin-btc.png" alt="" width="24" height="24" />
                <span class="chip__name">Bitcoin</span>
              </li>
              <li class="chip">
                <img class="chip__icon" src="img/coin-btc.png" alt="" width="24" height="24" />
                <span class="chip__name">Litecoin</span>
              </li>
              <li class="chip">
                <img class="chip__icon" src="img/coin-btc.png" alt="" width="24" height="24" />
                <span class="chip__name">Chainlink</span>
              </li>
              <li class="chip">
                <img class="chip__icon" src="img/coin-btc.png" alt="" width="24" height="24" />
                <span class="chip__name">Siacoin</span>
              </li>
            </ul>
          </div>
        </div>
      </section>
      <section class="how-to-trade"></section>
      <section class="cryptos" id="cryptos"></section>
      <section class="features" id="features"></section>
      <section class="promo"></section>
      <section class="testimonials" id="testimonial"></section>
      <section class="analysis" id="university"></section>
    </main>

    <footer class="footer"></footer>

    <script src="js/main.js" defer></script>
  </body>
</html>
